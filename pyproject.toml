[project]
name = "marqov"
dynamic = ["version"]   # single-sourced from marqov/__init__.py (see [tool.hatch.version])
description = "Open-source Python SDK for running quantum circuits across multiple hardware backends"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Marqov" },
]
keywords = ["quantum", "quantum-computing", "qpu", "braket", "qiskit", "cirq", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Workflow engine
    "temporalio>=1.7.0",
    # Circuit transpilation (marqov-owned fork of QuantumFlow v1.4.0; see marqov-dev/marqov-quantumflow)
    "marqov-quantumflow==1.0.2",
    # Workflow serialization is core, independent of provider installations.
    "cloudpickle>=2.2.1",
    # Azure Quantum
    "azure-quantum>=1.0.0",
    # CLI
    "click>=8.0.0",
    # Configuration
    "pydantic>=2.0.0",
    # Logging
    "structlog>=24.0.0",
    # HTTP client (required by marqov.platform)
    "requests>=2.31.0",
    # Core
    "numpy>=1.26.0,<2.4",
    "scipy>=1.11.2",   # 1.11.0/1.11.1 have no cp312 wheel
]

[project.optional-dependencies]
braket = [
    # Earlier versions permit unsafe deserialization of job results/checkpoints.
    "amazon-braket-sdk>=1.117.0",
]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0.0",  # release-workflow dependency regression check
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    # Test-only: exercises marqov.qutip.record's mesolve/mcsolve integration
    # tests (tests/qutip/test_record.py). Also available through the qutip extra;
    # record.py duck-types the qutip Result and never imports qutip itself.
    "qutip>=5.3.0,<6.0.0",
    # Test-only: tests/test_cunqa_qpe_reference_circuit.py simulates the QPE
    # reference circuit directly via AerSimulator to verify it independently
    # of any live CUNQA cluster. Not a runtime dependency of cunqa.py itself
    # (CUNQA wraps its own Aer internally, on the cluster).
    "qiskit-aer>=0.14.0",
]
qutip = [
    "qutip>=5.3.0,<6.0.0",
]
qiskit = [
    # <2.6: qiskit 2.6.0's native extension exhausts glibc's static TLS block on
    # Linux, so pennylane-lightning's bundled libgomp then fails to load
    # ("cannot allocate memory in static TLS block") whenever qiskit is imported
    # first. Confirmed 2026-10-17 with lightning 0.45.0; lift when lightning or
    # qiskit ships a fix. The same ceiling is repeated in every extra below.
    "qiskit>=1.0.0,<2.6",
    "qiskit-qasm3-import>=0.5.0",
]
ibm = [
    "qiskit>=1.0.0,<2.6",
    "qiskit-ibm-runtime>=0.21.0",
]
cirq = [
    "cirq-core>=1.0.0",
]
cudaq = [
    # cudaq ships Linux-only wheels; the marker keeps macOS/Windows installs from
    # failing (they get the transpile deps but not the runtime).
    "cudaq>=0.14.2 ; platform_system == 'Linux'",
    "qiskit>=1.0.0,<2.6",  # transpile path: Marqov Circuit -> Qiskit -> CUDA-Q kernel
]
pennylane = [
    # Circuit.from_pennylane / to_pennylane and the LightningExecutor
    # (lightning.qubit). The executor is tested against the 0.45 series; Lightning
    # plugins are released in lockstep with PennyLane, so both floors move together.
    "pennylane>=0.45.0",
    "pennylane-lightning>=0.45.0",
]
lightning-kokkos = [
    # Optional second CPU engine for LightningExecutor (device="lightning.kokkos").
    # Wheels exist for Linux x86_64/aarch64 and macOS arm64 only. The marker limits
    # the install to those platforms so others never fall back to building the sdist
    # (which needs CMake and Kokkos).
    "pennylane>=0.45.0",
    "pennylane-lightning>=0.45.0",
    "pennylane-lightning-kokkos>=0.45.0 ; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
]
pytket = [
    "pytket>=2.0.0",
    "pytket-qiskit>=0.50.0",
    "qiskit>=1.0.0,<2.6",
]
quantinuum = [
    "pytket>=2.0.0",
    "pytket-quantinuum>=0.40.0",
    "pytket-qiskit>=0.50.0",
    "qiskit>=1.0.0,<2.6",
]
pyquil = [
    "pyquil>=4.0.0",
]
openqasm = [
    "qiskit>=1.0.0,<2.6",
    "qiskit-qasm3-import>=0.5.0",
]
azure = [
    # Select the vendor's adapter dependencies, including Q# for Qiskit and
    # its supported Cirq range. Installing frameworks alone is insufficient.
    "azure-quantum[qiskit,cirq]>=3.13.0,<4.0.0",
    "qiskit>=1.0.0,<2.6",
    "cirq>=1.0.0",
]
ionq = [
    "requests>=2.31.0",
    "qiskit>=1.0.0,<2.6",
]
rigetti = [
    "pyquil>=4.0.0",
]
all = [
    "azure-quantum[qiskit,cirq]>=3.13.0,<4.0.0",
    "amazon-braket-sdk>=1.117.0",
    "qutip>=5.3.0,<6.0.0",
    "qiskit>=1.0.0,<2.6",
    "qiskit-ibm-runtime>=0.21.0",
    "qiskit-qasm3-import>=0.5.0",
    "cirq-core>=1.0.0",
    "pennylane>=0.45.0",
    "pennylane-lightning>=0.45.0",
    "pytket>=2.0.0",
    "pytket-quantinuum>=0.40.0",
    "pytket-qiskit>=0.50.0",
    "pyquil>=4.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/marqov-dev/marqov-sdk"
Repository = "https://github.com/marqov-dev/marqov-sdk.git"
Issues = "https://github.com/marqov-dev/marqov-sdk/issues"
Changelog = "https://github.com/marqov-dev/marqov-sdk/blob/main/CHANGELOG.md"

[project.scripts]
marqov = "marqov.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "marqov/__init__.py"   # __version__ here is the single source of truth

[tool.hatch.build.targets.wheel]
packages = ["marqov"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
# The whole package is checked, including the bodies of unannotated functions.
# `strict = true` was declared here before but never enforced (176 errors);
# see docs/quality/lint-baseline-2026-10.md. Strict-style checks apply to the
# modules listed below, which already pass them.
check_untyped_defs = true

# Optional provider SDKs that ship without type information, or are not
# installed by the `all` extra.
[[tool.mypy.overrides]]
module = [
    "azure.quantum.*",
    "boto3",
    "braket.*",
    "cloudpickle",
    "cunqa.*",
    "pennylane",
    "qilisdk.*",
    "qiskit.*",
    "qiskit_alice_bob_provider",
    "qiskit_ibm_runtime.*",
    "quantumflow",
    "sentry_sdk",
]
ignore_missing_imports = true

# Strict-style checks for modules that pass them. Add a module here once it
# passes; do not remove one to make an error go away. disallow_untyped_calls is
# left off so a module's status does not depend on the typing of its callees.
[[tool.mypy.overrides]]
module = [
    "marqov",
    "marqov._optional",
    "marqov.benchmarking",
    "marqov.benchmarking.fidelity",
    "marqov.benchmarking.spam",
    "marqov.executors",
    "marqov.executors._blocking",
    "marqov.executors._counts",
    "marqov.executors._params",
    "marqov.executors.alice_bob",
    "marqov.executors.base",
    "marqov.executors.local",
    "marqov.executors.qb_remote",
    "marqov.executors.qilisdk",
    "marqov.executors.rigetti",
    "marqov.executors.speqtrum",
    "marqov.experiments",
    "marqov.platform",
    "marqov.platform._native",
    "marqov.platform.errors",
    "marqov.qutip",
    "marqov.qutip.record",
    "marqov.simulation",
    "marqov.simulation.backends",
    "marqov.simulation.executor",
    "marqov.simulation.noise",
    "marqov.workflows",
    "marqov.workflows._child_env",
    "marqov.workflows._task_child",
    "marqov.workflows.activity",
    "marqov.workflows.capture",
    "marqov.workflows.graph",
    "marqov.workflows.runner",
    "marqov.workflows.temporal_workflow",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_generics = true
warn_return_any = true

# Temporarily exempted: these modules do not pass check_untyped_defs yet.
# Burn this list down; do not add to it.
[[tool.mypy.overrides]]
module = [
    "marqov._braket_native",
    "marqov.cli",
    "marqov.executors._braket_provenance",
    "marqov.executors.braket",
    "marqov.executors.factory",
    "marqov.executors.ionq",
    "marqov.workflows.decorators",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
# An unawaited coroutine (for example an async @task called without await)
# warns from its finalizer, where the error filter can only raise an ignored
# exception; pytest reports that as PytestUnraisableExceptionWarning, so both
# are errors for the leak to fail the test. Both match only unawaited
# coroutines, so other third-party warnings stay warnings. (Filter fields are
# split on ":", so "." stands in for the colon after "Exception ignored in".)
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error:Exception ignored in. <coroutine object:pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "integration: requires external hardware, a cluster, or a local service; opt-in via module environment guards",
]
