[project]
name = "marqov"
dynamic = ["version"]   # single-sourced from marqov/__init__.py (see [tool.hatch.version])
description = "Open-source Python SDK for running quantum circuits across multiple hardware backends"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Marqov" },
]
keywords = ["quantum", "quantum-computing", "qpu", "braket", "qiskit", "cirq", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # Workflow engine
    "temporalio>=1.7.0",
    # Circuit transpilation (marqov-owned fork of QuantumFlow v1.4.0; see marqov-dev/marqov-quantumflow)
    "marqov-quantumflow==1.0.0",
    # AWS Braket
    "amazon-braket-sdk>=1.80.0",
    # Azure Quantum
    "azure-quantum>=1.0.0",
    # CLI
    "click>=8.0.0",
    # Configuration
    "pydantic>=2.0.0",
    # Logging
    "structlog>=24.0.0",
    # HTTP client (required by marqov.platform)
    "requests>=2.31.0",
    # Core
    "numpy>=1.26.0,<2.4",
    "scipy>=1.11.2",   # 1.11.0/1.11.1 have no cp312 wheel
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]
qiskit = [
    "qiskit>=1.0.0",
    "qiskit-qasm3-import>=0.5.0",
]
ibm = [
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.20.0",
]
cirq = [
    "cirq-core>=1.0.0",
]
pennylane = [
    "pennylane>=0.35.0",
]
pytket = [
    "pytket>=2.0.0",
    "pytket-qiskit>=0.50.0",
    "qiskit>=1.0.0",
]
quantinuum = [
    "pytket>=2.0.0",
    "pytket-quantinuum>=0.40.0",
    "pytket-qiskit>=0.50.0",
    "qiskit>=1.0.0",
]
pyquil = [
    "pyquil>=4.0.0",
]
openqasm = [
    "qiskit>=1.0.0",
    "qiskit-qasm3-import>=0.5.0",
]
azure = [
    "qiskit>=1.0.0",
    "cirq>=1.0.0",
]
ionq = [
    "requests>=2.31.0",
    "qiskit>=1.0.0",
]
rigetti = [
    "pyquil>=4.0.0",
]
all = [
    "qiskit>=1.0.0",
    "qiskit-ibm-runtime>=0.20.0",
    "qiskit-qasm3-import>=0.5.0",
    "cirq-core>=1.0.0",
    "pennylane>=0.35.0",
    "pytket>=2.0.0",
    "pytket-quantinuum>=0.40.0",
    "pytket-qiskit>=0.50.0",
    "pyquil>=4.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/marqov-dev/marqov-sdk"
Repository = "https://github.com/marqov-dev/marqov-sdk.git"
Issues = "https://github.com/marqov-dev/marqov-sdk/issues"
Changelog = "https://github.com/marqov-dev/marqov-sdk/blob/main/CHANGELOG.md"

[project.scripts]
marqov = "marqov.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "marqov/__init__.py"   # __version__ here is the single source of truth

[tool.hatch.build.targets.wheel]
packages = ["marqov"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
