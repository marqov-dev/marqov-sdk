name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # manual TestPyPI dry-run
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv && uv build
      - name: Assert built version matches the tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test -f "dist/marqov-${TAG}-py3-none-any.whl" \
            || { echo "FAIL: built wheel is not version ${TAG} (check pyproject version)"; ls dist/; exit 1; }
          echo "version OK: ${TAG}"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI also never allows a version to be reused; this keeps a
          # repeated dry-run of the same X.Y.Z idempotent. Deliberately NOT set
          # on publish-pypi, where a duplicate upload should be a hard failure.
          skip-existing: true

  publish-pypi:
    needs: build
    # Both conditions: a dispatch against a tag ref sets github.ref to that tag,
    # so the ref check alone would let a "TestPyPI dry-run" publish to real PyPI.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
