name: Python compatibility
on:
  workflow_call:
  workflow_dispatch:
jobs:
  qualify:
    name: Python 3.13 / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        profile: [core, braket, qiskit, cirq, pennylane, qutip, pytket, quantinuum, openqasm, ibm, azure, ionq, lightning-kokkos, cudaq, qilisdk, alice-bob, qb-remote]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Build candidate wheel
        run: pip install uv && uv build && uv venv .venv
      - name: Qualify isolated installed integration
        run: >-
          .venv/bin/python tools/qualify_python.py
          --wheel "$(realpath dist/*.whl)"
          --output "$RUNNER_TEMP/qualification-${{ matrix.profile }}"
          --source-commit "$GITHUB_SHA"
          --profiles "${{ matrix.profile }}"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python313-${{ matrix.profile }}
          path: ${{ runner.temp }}/qualification-${{ matrix.profile }}/
