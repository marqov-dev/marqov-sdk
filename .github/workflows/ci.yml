name: CI
on:
  # PRs run via pull_request; direct pushes run only on main (post-merge).
  # Previously `push: branches: ["**"]` + `pull_request:` ran CI TWICE on every
  # PR commit (once per event) and also ran on every throwaway branch push.
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  watch-ui:
    name: Watch terminal viewer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marqov/platform/_watch_ui
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install uv
        run: pip install uv
      # Lockfile consistency and fresh dependency compatibility are separate
      # checks: retain the existing unconstrained extras installation below.
      - name: Verify lockfile is current
        run: uv lock --check
      # Install the [all] backend extras (qiskit/cirq/pennylane/pytket/quantinuum/
      # pyquil): the circuit-interop / device / executor tests import these at
      # module load and HARD-FAIL (ModuleNotFoundError) rather than skip when
      # absent. Installing them is what makes the full suite green.
      - name: Install (with all backend extras + dev)
        run: uv pip install --system -e ".[all,dev]"
      - name: No-URL-deps guard
        run: python tools/check_no_url_deps.py
      - name: Test suite
        run: pytest tests/ -q

  # CUDA-Q is Linux-only and heavy, so it is NOT in [all] — the main `test` job
  # skips test_real_cudaq_bell_state. This job installs [cudaq] on Linux so that
  # real CUDA-Q run actually executes (on the qpp-cpu target; no GPU required).
  test-cudaq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install uv
        run: pip install uv
      - name: Install (with cudaq + dev)
        run: uv pip install --system -e ".[cudaq,dev]"
      - name: CUDA-Q executor tests (incl. real qpp-cpu run)
        run: pytest tests/test_cudaq_executor.py -q

  lint:
    name: Lint (advisory)
    # Existing findings are visible without weakening required test gates.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install lint environment
        run: pip install uv && uv pip install --system -e ".[all,dev]"
      - name: Ruff findings
        run: ruff --version && ruff check .
      - name: Ruff findings by rule
        if: success() || failure()
        run: ruff check . --statistics
      - name: Mypy findings
        if: success() || failure()
        run: mypy marqov

  python313-qualified:
    uses: ./.github/workflows/python-compatibility.yml

  python313-unsupported:
    name: Python 3.13 / ${{ matrix.profile }} (advisory)
    # These installs currently fail upstream. Retain each restriction visibly;
    # they must not prevent testing the independently qualified integrations.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [pyquil, rigetti, all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Build candidate wheel
        run: pip install uv && uv build && uv venv .venv
      - name: Measure unsupported integration
        run: >-
          .venv/bin/python tools/qualify_python.py
          --wheel "$(realpath dist/*.whl)"
          --output "$RUNNER_TEMP/qualification-${{ matrix.profile }}"
          --source-commit "$GITHUB_SHA"
          --profiles "${{ matrix.profile }}"
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python313-${{ matrix.profile }}
          path: ${{ runner.temp }}/qualification-${{ matrix.profile }}/

  # Single required status check — the ruleset requires only "CI Success", so the
  # required context stays stable if the job set ever changes.
  #
  # INVARIANT: every blocking job must be listed in `needs:` here (test,
  # test-cudaq and python313-qualified). Lint and python313-unsupported are
  # advisory and excluded by name.
  # Add new blocking jobs to `needs:` in the same PR.
  #
  # `if: always()` runs this even when an upstream job fails; the step then fails
  # unless EVERY needed result is 'success'. A naive `success()` gate would go
  # GREEN when an upstream job was skipped.
  ci-success:
    name: CI Success
    if: always()
    needs: [test, test-cudaq, python313-qualified]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A required job did not succeed — results: ${{ join(needs.*.result, ', ') }}"
          exit 1
