name: CI
on:
  # PRs run via pull_request; direct pushes run only on main (post-merge).
  # Previously `push: branches: ["**"]` + `pull_request:` ran CI TWICE on every
  # PR commit (once per event) and also ran on every throwaway branch push.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  watch-ui:
    name: Watch terminal viewer
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marqov/platform/_watch_ui
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
  ci-scope:
    # Drafts allocate no runner. Marking ready emits ready_for_review below.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_code: ${{ steps.scope.outputs.run_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Classify documentation-only changes
        run: python3 .github/scripts/ci_scope.py

  test:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install uv
        run: pip install uv
      # Lockfile consistency and fresh dependency compatibility are separate
      # checks: retain the existing unconstrained extras installation below.
      - name: Verify lockfile is current
        run: uv lock --check
      # Install the [all] backend extras (qiskit/cirq/pennylane/pytket/quantinuum/
      # pyquil): the circuit-interop / device / executor tests import these at
      # module load and HARD-FAIL (ModuleNotFoundError) rather than skip when
      # absent. Installing them is what makes the full suite green.
      - name: Install (with all backend extras + dev)
        run: uv pip install --system -e ".[all,dev]"
      - name: No-URL-deps guard
        run: python tools/check_no_url_deps.py
      - name: Test suite
        run: pytest tests/ -q

  # CUDA-Q is Linux-only and heavy, so it is NOT in [all] — the main `test` job
  # skips test_real_cudaq_bell_state. This job installs [cudaq] on Linux so that
  # real CUDA-Q run actually executes (on the qpp-cpu target; no GPU required).
  test-cudaq:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install uv
        run: pip install uv
      - name: Install (with cudaq + dev)
        run: uv pip install --system -e ".[cudaq,dev]"
      - name: CUDA-Q executor tests (incl. real qpp-cpu run)
        run: pytest tests/test_cudaq_executor.py -q

  # Cheap doc/code sync checks. They run on every non-draft change, including
  # documentation-only ones that skip the dependency-heavy jobs, because these
  # tests read the prose itself (README provider table, SECURITY.md supported
  # row, the documented native-workflow example, the private-reference scan)
  # and docs can drift without any code change. Core install only, no extras.
  docs-check:
    needs: ci-scope
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install (core + test runner only)
        run: pip install uv && uv pip install --system -e . "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "pyyaml>=6.0.0"
      - name: Doc-pinning tests
        run: >-
          pytest -q
          tests/test_executors.py::TestProviderListDocSync
          tests/test_platform_submit_native.py::test_the_documented_example_is_the_example_file_verbatim
          tests/test_no_private_references.py
          tests/test_version.py
          tests/test_python_compatibility_policy.py
      - name: Test IDs cited in the docs exist
        # One ID per call: pytest mis-collects some overlapping ID lists.
        run: |
          # shellcheck disable=SC2016  # the backticks are literal Markdown, not expansions
          ids=$(grep -rhoE '`tests/[A-Za-z0-9_/]+\.py::[][A-Za-z0-9_:-]+`' \
                README.md CONTRIBUTING.md SECURITY.md RELEASING.md docs | tr -d '`' | sort -u)
          missing=0
          for id in $ids; do
            # Exit 0 only when the ID collects (4: not found, 5: nothing collected).
            if ! pytest --collect-only -q "$id" >/dev/null 2>&1; then
              echo "::error::Cited test does not collect: $id"; missing=1
            fi
          done
          exit $missing

  lint:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    name: Lint (advisory)
    # Existing findings are visible without weakening required test gates.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install lint environment
        run: pip install uv && uv pip install --system -e ".[all,dev]"
      - name: Ruff findings
        run: ruff --version && ruff check .
      - name: Ruff findings by rule
        if: success() || failure()
        run: ruff check . --statistics
      - name: Mypy findings
        if: success() || failure()
        run: mypy marqov

  python313-qualified:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    uses: ./.github/workflows/python-compatibility.yml

  python313-unsupported:
    needs: ci-scope
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && needs.ci-scope.outputs.run_code == 'true' }}
    name: Python 3.13 / ${{ matrix.profile }} (advisory)
    # These installs currently fail upstream. Retain each restriction visibly;
    # they must not prevent testing the independently qualified integrations.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [pyquil, rigetti, all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Build candidate wheel
        run: pip install uv && uv build && uv venv .venv
      - name: Measure unsupported integration
        run: >-
          .venv/bin/python tools/qualify_python.py
          --wheel "$(realpath dist/*.whl)"
          --output "$RUNNER_TEMP/qualification-${{ matrix.profile }}"
          --source-commit "$GITHUB_SHA"
          --profiles "${{ matrix.profile }}"
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python313-${{ matrix.profile }}
          path: ${{ runner.temp }}/qualification-${{ matrix.profile }}/

  # Single required status check — the ruleset requires only "CI Success", so the
  # required context stays stable if the job set ever changes.
  #
  # INVARIANT: the scope planner and every blocking job must be listed in
  # `needs:` here (docs-check, test, test-cudaq, python313-qualified and watch-ui).
  # Lint and python313-unsupported are advisory and excluded by name.
  # Add new blocking jobs to `needs:` in the same PR.
  #
  # Always evaluate non-draft results: require code jobs to succeed, or to
  # skip deliberately after a successful documentation-only scope decision.
  # Planner failures and unexpected skips must never satisfy this gate.
  ci-success:
    name: CI Success
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    needs: [ci-scope, docs-check, test, test-cudaq, python313-qualified, watch-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful code checks or deliberate documentation skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_GATE'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          scope = needs.pop("ci-scope")
          if scope["result"] != "success":
              raise SystemExit("Scope planner did not succeed")
          if needs.pop("docs-check")["result"] != "success":
              raise SystemExit("Doc/code sync checks did not succeed")
          run_code = scope["outputs"].get("run_code")
          if run_code not in {"true", "false"}:
              raise SystemExit("Scope planner returned no valid decision")
          expected = "success" if run_code == "true" else "skipped"
          unexpected = {name: job["result"] for name, job in needs.items() if job["result"] != expected}
          if unexpected:
              raise SystemExit(f"Required jobs must be {expected}: {unexpected}")
          PY_GATE
