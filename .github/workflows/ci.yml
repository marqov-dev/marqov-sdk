name: CI
on:
  # PRs run via pull_request; direct pushes run only on main (post-merge).
  # Previously `push: branches: ["**"]` + `pull_request:` ran CI TWICE on every
  # PR commit (once per event) and also ran on every throwaway branch push.
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install uv
        run: pip install uv
      # Install the [all] backend extras (qiskit/cirq/pennylane/pytket/quantinuum/
      # pyquil): the circuit-interop / device / executor tests import these at
      # module load and HARD-FAIL (ModuleNotFoundError) rather than skip when
      # absent. Installing them is what makes the full suite green.
      - name: Install (with all backend extras + dev)
        run: uv pip install --system -e ".[all,dev]"
      - name: No-URL-deps guard
        run: python tools/check_no_url_deps.py
      - name: Test suite
        run: pytest tests/ -q

  # CUDA-Q is Linux-only and heavy, so it is NOT in [all] — the main `test` job
  # skips test_real_cudaq_bell_state. This job installs [cudaq] on Linux so that
  # real CUDA-Q run actually executes (on the qpp-cpu target; no GPU required).
  test-cudaq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install uv
        run: pip install uv
      - name: Install (with cudaq + dev)
        run: uv pip install --system -e ".[cudaq,dev]"
      - name: CUDA-Q executor tests (incl. real qpp-cpu run)
        run: pytest tests/test_cudaq_executor.py -q

  # Single required status check — the ruleset requires only "CI Success", so the
  # required context stays stable if the job set ever changes.
  #
  # INVARIANT: every job above must be listed in `needs:` here. A job missing here
  # can fail while CI Success stays green and the ruleset stays satisfied — its
  # failures become invisible. Add new jobs to `needs:` in the same PR.
  #
  # `if: always()` runs this even when an upstream job fails; the step then fails
  # unless EVERY needed result is 'success'. A naive `success()` gate would go
  # GREEN when an upstream job was skipped.
  ci-success:
    name: CI Success
    if: always()
    needs: [test, test-cudaq]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A required job did not succeed — results: ${{ join(needs.*.result, ', ') }}"
          exit 1
